<h1>쿠팡 영상 마스터</h1>
<p>쿠팡 영상 마스터는 운영자가 직접 관리하는 유튜브 채널에 상품 추천 영상을 만들어 올리는 개인용 도구입니다.</p>
<ul>
  <li>상품 정보(쿠팡파트너스·알리익스프레스 어필리에이트 공식 API)로 추천 영상을 만듭니다.</li>
  <li>운영자가 연결한 유튜브 채널에만 영상을 업로드하고, 구매 링크 댓글을 달고, 조회수·분석 통계를 확인합니다.</li>
  <li>이 도구는 운영자 본인의 채널 관리용이며 일반 사용자에게 서비스하지 않습니다.</li>
</ul>
